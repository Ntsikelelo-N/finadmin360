version: 2

models:
  - name: silver_invoices
    description: "Cleaned and validated invoice records. One row per invoice."
    columns:
      - name: invoice_id
        description: "Unique invoice identifier"
        tests:
          - unique        # No two invoices may share an ID
          - not_null      # Every row must have an ID

      - name: supplier_id
        description: "Foreign key to silver_suppliers"
        tests:
          - not_null

      - name: invoice_status
        description: "Current payment status"
        tests:
          - not_null
          - accepted_values:
              values: ['PAID', 'OVERDUE', 'PENDING', 'UNKNOWN']

      - name: vat_validation_status
        description: "Whether the VAT amount equals 15% of excl amount"
        tests:
          - accepted_values:
              values: ['VALID', 'VAT_MISMATCH']

      - name: currency
        description: "Must always be ZAR in this dataset"
        tests:
          - accepted_values:
              values: ['ZAR']

      - name: amount_incl_vat
        description: "Total amount including VAT — must be positive"
        tests:
          - not_null

  - name: silver_suppliers
    description: "Cleaned supplier master table. One row per supplier."
    columns:
      - name: supplier_id
        tests:
          - unique
          - not_null
      - name: supplier_name
        tests:
          - not_null

  - name: silver_bank_transactions
    description: "Cleaned bank transaction records."
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: transaction_date
        tests:
          - not_null
