version: 2

models:
  - name: silver_invoices
    description: "Cleaned and validated invoice records. One row per invoice."
    columns:
      - name: invoice_id
        description: "Unique invoice identifier"
        tests:
          - not_null

      - name: supplier_id
        description: "Unique supplier identifier"
        tests:
          - not_null
          - unique:
              config:
                severity: warn

      - name: invoice_status
        description: "Standardised payment status"
        tests:
          - not_null
          - accepted_values:
              values: ['PAID', 'OVERDUE', 'PENDING', 'UNKNOWN']
              quote: true

      - name: vat_validation_status
        description: "Whether VAT equals 15% of excl amount"
        tests:
          - accepted_values:
              values: ['VALID', 'VAT_MISMATCH']
              quote: true

      - name: amount_incl_vat
        description: "Total amount including VAT"
        tests:
          - not_null

  - name: silver_suppliers
    description: "Cleaned supplier master table. One row per supplier."
    columns:
      - name: supplier_id
        description: "Unique supplier identifier"
        tests:
          - not_null

      - name: supplier_name
        description: "Supplier company name"
        tests:
          - not_null

  - name: silver_bank_transactions
    description: "Cleaned bank cashbook transactions."
    columns:
      - name: transaction_id
        description: "Unique transaction identifier"
        tests:
          - not_null

      - name: transaction_date
        description: "Date of the bank transaction"
        tests:
          - not_null
# in dbt/tests/unique_silver_suppliers_supplier_id.sql or schema.yml
config:
  severity: warn
